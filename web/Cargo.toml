[package]
name = "avatar-anim-web"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
avatar-anim = { path = ".." }
console_error_panic_hook = "0.1"
glam = "0.31"
js-sys = "0.3"
leptos = { version = "0.8.20", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Blob",
    "DataTransfer",
    "Document",
    "DragEvent",
    "Element",
    "Event",
    "File",
    "FileList",
    "HtmlAnchorElement",
    "HtmlElement",
    "HtmlInputElement",
    "KeyboardEvent",
    "Node",
    "PointerEvent",
    "Url",
    "Window",
] }
